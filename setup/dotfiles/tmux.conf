set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on # nvim FocusLost/FocusGained (screensaver pauses when you leave nvim)

set -g prefix C-b
unbind C-a
bind-key C-b send-prefix

unbind |
bind % split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind H resize-pane -L 5

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

bind-key -r i run-shell "tmux neww ~/.tmux-cht.sh"
# prefix + e: gaufre (terminal api client) in a floating popup; q inside it closes it
bind-key e display-popup -E -b rounded -S fg=magenta -T " Gaufre " -w 80% -h 80% -d "#{pane_current_path}" "~/.config/nvim/tools/gaufre/gaufre --popup"
# bind-key -r e run-shell "tmux neww ~/programming/Gomodoro/run_gomodoro.sh"

# prefix + Space: hex, a cheat sheet of every binding in this config (nvim, tmux, zsh) in a floating popup (replaces tmux's next-layout); q closes it
bind-key Space display-popup -E -b rounded -S 'fg=#2c6b45' -T " Hex " -w 80% -h 80% "~/.config/nvim/tools/hex/hex --popup"

# prefix + v: nvim in a new window, started from ~ so the dashboard lists every
# recent file (opening one moves nvim into its project); q on the dashboard closes it
bind-key v new-window -n nvim -c "$HOME" "nvim"

# prefix + t: nyancat in a new window (replaces the default clock-mode); press ctrl-c to quit
unbind t
bind-key t new-window -n nyancat "nyancat"

# prefix + p: floating claude chat for quick questions (runs in ~/.claude-chat, not a repo).
# the session survives closing the popup; prefix + p again inside it hides it.
bind-key p if-shell -F '#{==:#{session_name},claude-chat}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -b rounded -T " claude " "mkdir -p ~/.claude-chat && TMUX= tmux new-session -A -s claude-chat -c ~/.claude-chat claude"'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'fabioluciano/tmux-tokyo-night'


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
